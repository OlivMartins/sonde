name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + unit + SQL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q tests

  e2e:
    name: full stack end to end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Validate the collector configuration
        run: |
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=x \
            -v "$PWD/otel-collector/config.yaml:/cfg.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.162.0 validate --config=/cfg.yaml
      - name: Start the stack
        run: docker compose up -d --build
      - name: Data flows from the agent to ClickHouse
        run: bash tests/e2e/check_stack.sh
      - name: Every Grafana panel query succeeds
        run: python3 tests/e2e/check_grafana_panels.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
