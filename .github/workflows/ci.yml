name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Style, tests unitaires et SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q tests

  e2e:
    name: Stack complète de bout en bout
    runs-on: ubuntu-latest
    needs: tests
    env:
      # capture everything so masking is exercised, and lose context often so the checks have work
      SONDE_CAPTURE_CONTENT: all
      SONDE_FAULT_LOST_CONTEXT_RATE: "0.5"
    steps:
      - uses: actions/checkout@v5
      - name: Valider les configurations du collector (socle, gateway, surcouches)
        run: bash tests/e2e/validate_collector.sh
      - name: Démarrer la stack
        run: docker compose up -d --build 2>&1 | tee up.log; exit "${PIPESTATUS[0]}"
      - name: Les données vont de l'agent à ClickHouse
        run: bash tests/e2e/check_stack.sh
      - name: Chaque panneau Grafana répond
        run: python3 tests/e2e/check_grafana_panels.py
      - name: Diagnostic en cas d'échec
        if: failure()
        run: bash tests/e2e/report_failure.sh
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  sampling:
    name: Échantillonnage en queue de bout en bout
    runs-on: ubuntu-latest
    needs: tests
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.sampling.yml
      SONDE_BASELINE_SAMPLING_PERCENT: "10"
    steps:
      - uses: actions/checkout@v5
      - name: Démarrer la stack avec le gateway d'échantillonnage
        run: docker compose up -d --build 2>&1 | tee up.log; exit "${PIPESTATUS[0]}"
      - name: Spans bruts échantillonnés, chiffres exacts, traces utiles gardées
        run: bash tests/e2e/check_sampling.sh
      - name: Chaque panneau Grafana répond
        run: python3 tests/e2e/check_grafana_panels.py
      - name: Diagnostic en cas d'échec
        if: failure()
        run: bash tests/e2e/report_failure.sh
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
