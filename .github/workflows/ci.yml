name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Style, tests unitaires et SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q tests

  e2e:
    name: Stack complète de bout en bout
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Valider la configuration du collector
        run: |
          docker run --rm -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=x \
            -v "$PWD/otel-collector/config.yaml:/cfg.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.162.0 validate --config=/cfg.yaml
      - name: Démarrer la stack
        run: docker compose up -d --build 2>&1 | tee up.log; exit "${PIPESTATUS[0]}"
      - name: Les données vont de l'agent à ClickHouse
        run: bash tests/e2e/check_stack.sh
      - name: Chaque panneau Grafana répond
        run: python3 tests/e2e/check_grafana_panels.py
      - name: Diagnostic en cas d'échec
        if: failure()
        run: bash tests/e2e/report_failure.sh
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
