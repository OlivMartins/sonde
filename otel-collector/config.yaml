# OpenTelemetry Collector (contrib 0.162.0)
#
#                                                      ┌─▶ traces/aggregates ─▶ drop content ─▶ otel_spans_stream (100%, feeds the views)
#   agent ─OTLP─▶ traces/in: normalize ─▶ redaction ─▶ forward
#                                                      └─▶ traces/raw ───────────────────────▶ otel_traces (drill-down)
#   evaluator ─OTLP─▶ logs: redaction ─▶ otel_logs (gen_ai.evaluation.result events)
#
#   normalize  maps legacy or third-party GenAI attribute names to the current
#              conventions, so a SDK upgrade or another instrumentation library
#              does not silently zero the dashboards. Renamed spans are marked
#              with sonde.semconv.legacy (tracked on the dashboard).
#   redaction  fail-closed allow-list of attribute keys, then masking of
#              secret-looking values in what is left.
#   forward    sends every span both ways. Overlays change the raw branch only:
#              overlays/sampling-edge.yaml routes it to a tail-sampling gateway,
#              overlays/langfuse.yaml and overlays/phoenix.yaml add a copy to
#              those tools. Aggregates and costs always see 100% of the spans.
#
# The exporters do not create tables (create_schema: false): the schema is
# owned by clickhouse/initdb/, as recommended for production deployments.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  forward:

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  transform/genai_normalize:
    error_mode: ignore
    trace_statements:
      # gen_ai.system was renamed gen_ai.provider.name
      - 'set(span.attributes["sonde.semconv.legacy"], "gen_ai.system") where span.attributes["gen_ai.system"] != nil and span.attributes["gen_ai.provider.name"] == nil'
      - 'set(span.attributes["gen_ai.provider.name"], span.attributes["gen_ai.system"]) where span.attributes["gen_ai.system"] != nil and span.attributes["gen_ai.provider.name"] == nil'
      # prompt / completion tokens were renamed input / output tokens
      - 'set(span.attributes["sonde.semconv.legacy"], "gen_ai.usage.prompt_tokens") where span.attributes["gen_ai.usage.prompt_tokens"] != nil and span.attributes["gen_ai.usage.input_tokens"] == nil'
      - 'set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["gen_ai.usage.prompt_tokens"]) where span.attributes["gen_ai.usage.prompt_tokens"] != nil and span.attributes["gen_ai.usage.input_tokens"] == nil'
      - 'set(span.attributes["sonde.semconv.legacy"], "gen_ai.usage.completion_tokens") where span.attributes["gen_ai.usage.completion_tokens"] != nil and span.attributes["gen_ai.usage.output_tokens"] == nil'
      - 'set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["gen_ai.usage.completion_tokens"]) where span.attributes["gen_ai.usage.completion_tokens"] != nil and span.attributes["gen_ai.usage.output_tokens"] == nil'
      # cache reads, older flat spelling
      - 'set(span.attributes["sonde.semconv.legacy"], "gen_ai.usage.cache_read_input_tokens") where span.attributes["gen_ai.usage.cache_read_input_tokens"] != nil and span.attributes["gen_ai.usage.cache_read.input_tokens"] == nil'
      - 'set(span.attributes["gen_ai.usage.cache_read.input_tokens"], span.attributes["gen_ai.usage.cache_read_input_tokens"]) where span.attributes["gen_ai.usage.cache_read_input_tokens"] != nil and span.attributes["gen_ai.usage.cache_read.input_tokens"] == nil'
      # OpenLLMetry-style chat spans without gen_ai.operation.name
      - 'set(span.attributes["sonde.semconv.legacy"], "llm.request.type") where span.attributes["gen_ai.operation.name"] == nil and span.attributes["llm.request.type"] == "chat"'
      - 'set(span.attributes["gen_ai.operation.name"], "chat") where span.attributes["gen_ai.operation.name"] == nil and span.attributes["llm.request.type"] == "chat"'

  # Prompts, tool arguments and tool results can be captured to debug agents
  # (SONDE_CAPTURE_CONTENT: off, errors, all). They routinely contain personal
  # data and secrets, so this processor runs before anything is stored, for
  # every agent and team at once.
  #
  # 1. Fail closed: only the attribute keys listed below are kept, on spans,
  #    span events, resources and scopes. Anything else is dropped and counted
  #    in redaction.redacted.count (tracked on the dashboard). To keep a new
  #    attribute, add it here: tests/test_collector_config.py checks that every
  #    key the demo agent emits is listed.
  # 2. Mask: values that look like secrets are replaced by ****. Regexes only
  #    catch known formats (e-mails, key=value secrets, bearer tokens); free-text
  #    personal data needs NER (see docs/ARCHITECTURE.md, "Limites connues").
  redaction/genai:
    allow_all_keys: false
    allowed_keys:
      # resource
      - service.name
      - service.namespace
      - service.version
      - service.instance.id
      - deployment.environment.name
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      - telemetry.distro.name
      - telemetry.distro.version
      - host.name
      - host.arch
      - os.type
      - container.id
      - k8s.namespace.name
      - k8s.pod.name
      - k8s.deployment.name
      - cloud.provider
      - cloud.region
      # GenAI semantic conventions
      - gen_ai.operation.name
      - gen_ai.provider.name
      - gen_ai.conversation.id
      - gen_ai.agent.id
      - gen_ai.agent.name
      - gen_ai.agent.version
      - gen_ai.agent.description
      - gen_ai.workflow.name
      - gen_ai.data_source.id
      - gen_ai.output.type
      - gen_ai.request.model
      - gen_ai.request.max_tokens
      - gen_ai.request.temperature
      - gen_ai.request.top_p
      - gen_ai.request.frequency_penalty
      - gen_ai.request.presence_penalty
      - gen_ai.request.stop_sequences
      - gen_ai.request.seed
      - gen_ai.request.choice.count
      - gen_ai.response.id
      - gen_ai.response.model
      - gen_ai.response.finish_reasons
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.usage.cache_read.input_tokens
      - gen_ai.usage.cache_write.input_tokens
      - gen_ai.tool.name
      - gen_ai.tool.type
      - gen_ai.tool.description
      - gen_ai.tool.call.id
      - gen_ai.embeddings.dimension.count
      # GenAI content (opt-in capture, values are masked below)
      - gen_ai.input.messages
      - gen_ai.output.messages
      - gen_ai.system_instructions
      - gen_ai.tool.definitions
      - gen_ai.tool.call.arguments
      - gen_ai.tool.call.result
      # general conventions: errors, exceptions, HTTP (stable and legacy names)
      - error.type
      - exception.type
      - exception.message
      - exception.stacktrace
      - exception.escaped
      - server.address
      - server.port
      - http.request.method
      - http.response.status_code
      - url.full
      - url.scheme
      - network.protocol.version
      - http.method
      - http.url
      - http.status_code
      # Sonde
      - sonde.task.category
      - sonde.agent.outcome
      - sonde.agent.parent
      - sonde.agent.steps
      - sonde.agent.step
      - sonde.agent.tool_calls
      - sonde.llm.retries
      - sonde.retry.attempt
      - sonde.retry.delay_s
      - sonde.tool.blocked
      - sonde.feedback.score
      - sonde.semconv.legacy
      - sonde.eval.sampled
      # evaluation events (logs)
      - gen_ai.evaluation.name
      - gen_ai.evaluation.score.value
      - gen_ai.evaluation.score.label
      - gen_ai.evaluation.explanation
      - sonde.evaluation.judge_model
    blocked_values:
      # e-mail addresses
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+'
      # key=value secrets in logs and arguments (stops before JSON escapes)
      - '(?i)(api[_-]?key|token|secret|password)=[^\s"\\,;]+'
      # bearer tokens in captured HTTP headers
      - '(?i)bearer [A-Za-z0-9._~+/-]+=*'
    # Adds redaction.masked.count and redaction.redacted.count: the dashboard tracks both.
    summary: info

  # The views only need numbers and names: content stays out of the aggregate branch.
  transform/drop_content:
    error_mode: ignore
    trace_statements:
      - 'delete_key(span.attributes, "gen_ai.input.messages")'
      - 'delete_key(span.attributes, "gen_ai.output.messages")'
      - 'delete_key(span.attributes, "gen_ai.tool.call.arguments")'
      - 'delete_key(span.attributes, "gen_ai.tool.call.result")'
      - 'delete_key(span.attributes, "gen_ai.system_instructions")'
      - 'delete_key(span.attributes, "gen_ai.tool.definitions")'

exporters:
  clickhouse/stream:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    traces_table_name: otel_spans_stream
    async_insert: true
    compress: lz4
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      batch:
        flush_timeout: 2s
        min_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s

  clickhouse/raw:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    async_insert: true
    compress: lz4
    timeout: 10s
    # Batching inside the exporter queue (replaces the standalone batch processor).
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      batch:
        flush_timeout: 2s
        min_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, transform/genai_normalize, redaction/genai]
      exporters: [forward]
    traces/aggregates:
      receivers: [forward]
      processors: [transform/drop_content]
      exporters: [clickhouse/stream]
    traces/raw:
      receivers: [forward]
      exporters: [clickhouse/raw]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/genai]
      exporters: [clickhouse/raw]
  telemetry:
    logs:
      level: info
